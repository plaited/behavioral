name: CodeQL

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      # javascript-typescript and actions are interpreted — no build step.
      - uses: github/codeql-action/analyze@v4
        with:
          # Reuse the default setup's category (`/language:<lang>`) so these
          # analyses supersede the old default-setup ones — otherwise the
          # already-open alerts live in a different category and are never
          # closed by the new (paths-ignored, zero-result) analysis.
          category: /language:${{ matrix.language }}
