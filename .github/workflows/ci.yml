name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          bun install
      - name: Cache betterleaks
        uses: actions/cache@v4
        with:
          path: scripts/betterleaks/.bin
          key: betterleaks-${{ runner.os }}-${{ runner.arch }}-v1.8.1
      - name: Install betterleaks
        run: |
          bun run betterleaks:install
      - name: Run check
        run: |
          bun run check
      - name: Run test
        run: |
          bun run test
