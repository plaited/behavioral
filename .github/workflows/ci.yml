name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        # No browser provisioning: the controller specs use Bun.WebView's chrome
        # backend, and GitHub ubuntu-latest runner images ship Google Chrome
        # preinstalled (Bun finds it via PATH / standard install locations).
        # If a runner image ever drops preinstalled Chrome, restore with:
        #   bunx playwright install chromium --only-shell --with-deps
        run: |
          bun install
      - name: Run check
        run: |
          bun run check
      - name: Run test
        run: |
          bun run test
